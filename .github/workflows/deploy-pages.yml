name: Build and deploy Amanah landing page
# Re-deploy after enabling GitHub Pages with GitHub Actions as the source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amanah-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Deno for Edge Function type-check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Facebook Marketing Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/facebook-marketing/index.ts
      - name: Check inline browser JavaScript syntax
        run: node -e 'const fs=require("fs");const html=fs.readFileSync("index.html","utf8");const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(match=>match[1]).filter(source=>source.trim());scripts.forEach(source=>new Function(source));console.log("Checked "+scripts.length+" inline script block(s)");'
      - name: Install build dependencies
        run: npm install
      - name: Compile production Tailwind CSS
        run: npm run build
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp favicon.svg _site/favicon.svg
          cp assets/tailwind.css _site/assets/tailwind.css
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
